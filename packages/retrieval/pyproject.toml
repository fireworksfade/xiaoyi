[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyi-retrieval"
version = "0.1.0"
description = "Shared embedding and Qdrant clients without domain or persistence rules"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["xiaoyi_retrieval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
