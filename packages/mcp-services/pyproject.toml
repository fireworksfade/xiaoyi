[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiaoyi-mcp-services"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.1.1",
  "paho-mqtt==2.1.0",
  "PyMySQL==1.2.0",
  "pypdf==6.17.0",
  "pydantic==2.12.5",
  "opentelemetry-api==1.29.0",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp==1.29.0",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = ["mypy==1.18.2", "pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.5"]

[tool.hatch.build.targets.wheel]
packages = ["common", "iot_diagnosis", "iot_control", "model_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# app.py 需在导入 transformers 前设置 HF_HUB_OFFLINE（offline 模式）
"model_service/app.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "iot_diagnosis.repositories.*"
disable_error_code = ["attr-defined"]
