[project]
name = "xiaoyi-backend"
version = "0.1.0"
description = "小yi 通用智能体主后端"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "fastapi==0.141.1",
  "openai-agents==0.22.0",
  "pydantic-settings==2.12.0",
  "pypdf==6.17.0",
  "prometheus-client==0.26.0",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "scripts*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# B008：FastAPI 依赖注入（File()/Depends()）在参数默认值中调用是框架惯用法
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest 需在导入 app 模块前设置 DATABASE_URL 等环境变量
"tests/conftest.py" = ["E402"]
