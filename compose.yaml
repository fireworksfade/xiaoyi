# Portable 档位：无 GPU、无模型下载即可运行。
# 诊断服务使用本地确定性检索（hash embedding + weighted reranker，384 维集合）。
services:
  backend:
    build:
      context: ./packages/backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      APP_SECRET_KEY: local-compose-change-me
      DATABASE_URL: sqlite+aiosqlite:///./data/xiaoyi.db
      FRONTEND_ORIGINS: http://localhost:3000
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,iot-mcp
      AGENT_RUNTIME: mock
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: xiaoyi-backend
      # 容器 CMD 已先执行 python -m app.cli deploy；应用启动只校验版本
      DB_AUTO_UPGRADE: "false"
      WORKFLOW_RUNTIME_ENABLED: "true"
      COMPLETION_GATE_ENABLED: "true"
      COMPLETION_GATE_MAX_CONTINUATIONS: "2"
      HOOK_TIMEOUT_MS: "500"
      MCP_AGENT_TIMEOUT_SECONDS: "90"
      RUN_TOOL_OUTPUT_INLINE_BYTES: "65536"
      RUN_ARTIFACT_ROOT: /app/data/run-artifacts
      RUN_ARTIFACT_RETENTION_HOURS: "168"
    volumes:
      - backend-data:/app/data
      - ./packages/backend/app:/app/app:ro
      - ./packages/backend/migrations:/app/migrations:ro
      - ./packages/backend/alembic.ini:/app/alembic.ini:ro
      - ./packages/backend/scripts:/app/scripts:ro
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  iot-mcp:
    build:
      context: ./packages/mcp-services
    command: sh -c "python -m scripts.migrate upgrade --service diagnosis && python -m scripts.migrate upgrade --service control && python -m iot_mcp.server"
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      PYTHONPATH: /app
      IOT_MCP_HOST: 0.0.0.0
      IOT_MCP_PORT: "9000"
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: xiaoyi-iot-mcp
      # Diagnosis settings
      DIAGNOSIS_DATABASE_PATH: /app/data/iot_diagnosis.db
      DIAGNOSIS_OFFLINE_AFTER_SECONDS: "30"
      DIAGNOSIS_LLM_BASE_URL: ${DIAGNOSIS_LLM_BASE_URL:-https://api.openai.com/v1}
      DIAGNOSIS_LLM_MODEL: ${DIAGNOSIS_LLM_MODEL:-}
      DIAGNOSIS_LLM_API_KEY: ${DIAGNOSIS_LLM_API_KEY:-}
      DIAGNOSIS_LLM_TIMEOUT_SECONDS: ${DIAGNOSIS_LLM_TIMEOUT_SECONDS:-20}
      DIAGNOSIS_QDRANT_URL: http://qdrant:6333
      DIAGNOSIS_QDRANT_COLLECTION: ${DIAGNOSIS_QDRANT_COLLECTION:-iot_diagnosis_portable}
      DIAGNOSIS_SYNC_RETRY_SECONDS: "30"
      DIAGNOSIS_EMBEDDING_PROVIDER: ${DIAGNOSIS_EMBEDDING_PROVIDER:-hash}
      DIAGNOSIS_EMBEDDING_DIMENSIONS: ${DIAGNOSIS_EMBEDDING_DIMENSIONS:-384}
      DIAGNOSIS_RERANKER_PROVIDER: ${DIAGNOSIS_RERANKER_PROVIDER:-weighted}
      DIAGNOSIS_MCP_BEARER_TOKEN: ${DIAGNOSIS_MCP_BEARER_TOKEN:-}
      DIAGNOSIS_READY_MAX_PENDING_SYNC: ${DIAGNOSIS_READY_MAX_PENDING_SYNC:-1000}
      DIAGNOSIS_RETENTION_INTERVAL_HOURS: ${DIAGNOSIS_RETENTION_INTERVAL_HOURS:-24}
      # RAG settings
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-512}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-64}
      RAG_RETRIEVAL_STRATEGY: ${RAG_RETRIEVAL_STRATEGY:-hybrid}
      RAG_ENABLE_SPARSE: ${RAG_ENABLE_SPARSE:-true}
      RAG_ENABLE_RRF: ${RAG_ENABLE_RRF:-true}
      RAG_ENABLE_RERANKER: ${RAG_ENABLE_RERANKER:-true}
      RAG_RERANKER_RANK_WEIGHT: ${RAG_RERANKER_RANK_WEIGHT:-2.0}
      RAG_RERANKER_RANK_FUSION_K: ${RAG_RERANKER_RANK_FUSION_K:-60}
      # Control settings
      CONTROL_DATABASE_PATH: /app/data/iot_control.db
      CONTROL_COMMAND_TIMEOUT_SECONDS: "30"
      CONTROL_VERIFY_WINDOW_SECONDS: "60"
      CONTROL_PROPOSAL_TTL_MINUTES: "30"
      # MQTT settings
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    volumes:
      - iot-mcp-data:/app/data
      - ./packages/mcp-services/common:/app/common:ro
      - ./packages/mcp-services/iot_diagnosis:/app/iot_diagnosis:ro
      - ./packages/mcp-services/iot_control:/app/iot_control:ro
      - ./packages/mcp-services/iot_mcp:/app/iot_mcp:ro
      - ./packages/mcp-services/scripts:/app/scripts:ro
      - ./packages/mcp-services/evals:/app/evals:ro
      - ./packages/mcp-services/knowledge:/app/knowledge:ro
    depends_on:
      mqtt:
        condition: service_started
      qdrant:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  iot-simulator-fleet:
    build:
      context: ./packages/mcp-services
    command: python -m iot_diagnosis.simulator --host mqtt --fleet /app/iot_diagnosis/fleet.json
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      PYTHONPATH: /app
    volumes:
      - ./packages/mcp-services/iot_diagnosis:/app/iot_diagnosis:ro
    depends_on:
      mqtt:
        condition: service_started
      iot-mcp:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  backend-data:
  iot-mcp-data:
  mqtt-data:
  qdrant-data:
