services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      APP_SECRET_KEY: local-compose-change-me
      DATABASE_URL: sqlite+aiosqlite:///./data/xiaoyi.db
      FRONTEND_ORIGINS: http://localhost:3000
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,iot-diagnosis-mcp
      AGENT_RUNTIME: mock
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
    volumes:
      - backend-data:/app/data
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
    restart: unless-stopped

  iot-diagnosis-mcp:
    build:
      context: ./mcp-services
    command: python -m iot_diagnosis.server
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      DIAGNOSIS_HOST: 0.0.0.0
      DIAGNOSIS_PORT: "9001"
      DIAGNOSIS_DATABASE_PATH: /app/data/iot_diagnosis.db
      DIAGNOSIS_OFFLINE_AFTER_SECONDS: "30"
      DIAGNOSIS_LLM_BASE_URL: ${DIAGNOSIS_LLM_BASE_URL:-https://api.openai.com/v1}
      DIAGNOSIS_LLM_MODEL: ${DIAGNOSIS_LLM_MODEL:-}
      DIAGNOSIS_LLM_API_KEY: ${DIAGNOSIS_LLM_API_KEY:-}
      DIAGNOSIS_LLM_TIMEOUT_SECONDS: ${DIAGNOSIS_LLM_TIMEOUT_SECONDS:-20}
      DIAGNOSIS_MYSQL_DSN: mysql://iot_diagnosis:${MYSQL_PASSWORD:-local-diagnosis-password}@mysql:3306/iot_diagnosis
      DIAGNOSIS_QDRANT_URL: http://qdrant:6333
      DIAGNOSIS_QDRANT_COLLECTION: iot_diagnosis_knowledge
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    volumes:
      - diagnosis-data:/app/data
      - ./mcp-services/iot_diagnosis:/app/iot_diagnosis:ro
    depends_on:
      mqtt:
        condition: service_started
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  iot-simulator:
    build:
      context: ./mcp-services
    command: python -m iot_diagnosis.simulator --host mqtt --device-id ESP32_05 --scenario mqtt_timeout
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    volumes:
      - ./mcp-services/iot_diagnosis:/app/iot_diagnosis:ro
    depends_on:
      - mqtt
      - iot-diagnosis-mcp
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: iot_diagnosis
      MYSQL_USER: iot_diagnosis
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-diagnosis-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  backend-data:
  diagnosis-data:
  mysql-data:
  qdrant-data:
