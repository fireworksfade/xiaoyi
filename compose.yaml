# Portable 档位：无 GPU、无模型下载即可运行。
# 诊断服务使用本地确定性检索（hash embedding + weighted reranker，384 维集合）。

# QEMU 上运行真实 xiaoyi-node 固件的 ESP32 设备，镜像由 esp32-ota 服务构建。
x-esp32-node: &esp32-node
  image: xiaoyi-esp32-node:local
  pull_policy: never
  init: true
  volumes:
    - esp32-flash:/flash
  depends_on:
    esp32-ota:
      condition: service_started
    toxiproxy:
      condition: service_started
  restart: unless-stopped

services:
  backend:
    build:
      context: ./packages/backend
      additional_contexts:
        retrieval: ./packages/retrieval
      args:
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      APP_SECRET_KEY: local-compose-change-me
      DATABASE_URL: sqlite+aiosqlite:///./data/xiaoyi.db
      FRONTEND_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,iot-mcp
      AGENT_RUNTIME: mock
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: lax
      # 容器 CMD 已先执行 python -m app.cli deploy；应用启动只校验版本
      DB_AUTO_UPGRADE: "false"
      HOOK_TIMEOUT_MS: "500"
      MCP_AGENT_TIMEOUT_SECONDS: ${MCP_AGENT_TIMEOUT_SECONDS:-90}
      RUN_TOOL_OUTPUT_INLINE_BYTES: "65536"
      RUN_ARTIFACT_ROOT: /app/data/run-artifacts
      RUN_ARTIFACT_RETENTION_HOURS: "168"
      RETRIEVAL_QDRANT_URL: ${RETRIEVAL_QDRANT_URL:-}
      RETRIEVAL_EMBEDDING_BASE_URL: ${RETRIEVAL_EMBEDDING_BASE_URL:-}
      RETRIEVAL_EMBEDDING_API_KEY: ${RETRIEVAL_EMBEDDING_API_KEY:-}
      RETRIEVAL_EMBEDDING_MODEL: ${RETRIEVAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      RETRIEVAL_EMBEDDING_DIMENSIONS: ${RETRIEVAL_EMBEDDING_DIMENSIONS:-512}
    volumes:
      - backend-data:/app/data
      - ./packages/backend/app:/app/app:ro
      - ./packages/backend/migrations:/app/migrations:ro
      - ./packages/backend/alembic.ini:/app/alembic.ini:ro
      - ./packages/backend/scripts:/app/scripts:ro
      - ./packages/retrieval/xiaoyi_retrieval:/usr/local/lib/python3.12/site-packages/xiaoyi_retrieval:ro
    restart: unless-stopped

  iot-mcp:
    build:
      context: ./packages/mcp-services
      additional_contexts:
        retrieval: ./packages/retrieval
      args:
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
    command: sh -c "python -m scripts.migrate upgrade --service diagnosis && python -m scripts.migrate upgrade --service control && python -m iot_mcp.server"
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      PYTHONPATH: /app
      IOT_MCP_HOST: 0.0.0.0
      IOT_MCP_PORT: "9000"
      # Diagnosis settings
      DIAGNOSIS_DATABASE_PATH: /app/data/iot_diagnosis.db
      DIAGNOSIS_OFFLINE_AFTER_SECONDS: "30"
      DIAGNOSIS_LLM_BASE_URL: ${DIAGNOSIS_LLM_BASE_URL:-https://api.openai.com/v1}
      DIAGNOSIS_LLM_MODEL: ${DIAGNOSIS_LLM_MODEL:-}
      DIAGNOSIS_LLM_API_KEY: ${DIAGNOSIS_LLM_API_KEY:-}
      DIAGNOSIS_LLM_TIMEOUT_SECONDS: ${DIAGNOSIS_LLM_TIMEOUT_SECONDS:-20}
      DIAGNOSIS_QDRANT_URL: ${DIAGNOSIS_QDRANT_URL:-${RETRIEVAL_QDRANT_URL:-http://qdrant:6333}}
      DIAGNOSIS_QDRANT_COLLECTION: ${DIAGNOSIS_QDRANT_COLLECTION:-iot_diagnosis_portable}
      DIAGNOSIS_SYNC_RETRY_SECONDS: "30"
      DIAGNOSIS_EMBEDDING_PROVIDER: ${DIAGNOSIS_EMBEDDING_PROVIDER:-hash}
      DIAGNOSIS_EMBEDDING_BASE_URL: ${DIAGNOSIS_EMBEDDING_BASE_URL:-${RETRIEVAL_EMBEDDING_BASE_URL:-https://api.openai.com/v1}}
      DIAGNOSIS_EMBEDDING_MODEL: ${DIAGNOSIS_EMBEDDING_MODEL:-${RETRIEVAL_EMBEDDING_MODEL:-}}
      DIAGNOSIS_EMBEDDING_API_KEY: ${DIAGNOSIS_EMBEDDING_API_KEY:-${RETRIEVAL_EMBEDDING_API_KEY:-}}
      DIAGNOSIS_EMBEDDING_DIMENSIONS: ${DIAGNOSIS_EMBEDDING_DIMENSIONS:-384}
      DIAGNOSIS_EMBEDDING_TIMEOUT_SECONDS: ${DIAGNOSIS_EMBEDDING_TIMEOUT_SECONDS:-20}
      DIAGNOSIS_VECTOR_BATCH_SIZE: ${DIAGNOSIS_VECTOR_BATCH_SIZE:-32}
      DIAGNOSIS_EMBEDDING_QUERY_INSTRUCTION: ${DIAGNOSIS_EMBEDDING_QUERY_INSTRUCTION-Given an IoT fault diagnosis query, retrieve relevant technical passages and verified cases}
      # API 是主模型；不可用时使用独立的 hash 集合，恢复后每次请求重新优先 API。
      DIAGNOSIS_EMBEDDING_FALLBACK: ${DIAGNOSIS_EMBEDDING_FALLBACK:-true}
      DIAGNOSIS_EMBEDDING_FALLBACK_DIMENSIONS: ${DIAGNOSIS_EMBEDDING_FALLBACK_DIMENSIONS:-384}
      DIAGNOSIS_QDRANT_FALLBACK_COLLECTION: ${DIAGNOSIS_QDRANT_FALLBACK_COLLECTION:-iot_diagnosis_portable}
      DIAGNOSIS_LOCAL_EMBEDDING_FALLBACK: ${DIAGNOSIS_LOCAL_EMBEDDING_FALLBACK:-false}
      DIAGNOSIS_LOCAL_EMBEDDING_BASE_URL: ${DIAGNOSIS_LOCAL_EMBEDDING_BASE_URL:-http://retrieval-models:9010/v1}
      DIAGNOSIS_LOCAL_EMBEDDING_MODEL: ${DIAGNOSIS_LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      DIAGNOSIS_LOCAL_EMBEDDING_API_KEY: ${DIAGNOSIS_LOCAL_EMBEDDING_API_KEY:-local-model-service}
      DIAGNOSIS_LOCAL_EMBEDDING_DIMENSIONS: ${DIAGNOSIS_LOCAL_EMBEDDING_DIMENSIONS:-512}
      DIAGNOSIS_LOCAL_EMBEDDING_TIMEOUT_SECONDS: ${DIAGNOSIS_LOCAL_EMBEDDING_TIMEOUT_SECONDS:-20}
      DIAGNOSIS_LOCAL_EMBEDDING_QUERY_INSTRUCTION: ${DIAGNOSIS_LOCAL_EMBEDDING_QUERY_INSTRUCTION-Given an IoT fault diagnosis query, retrieve relevant technical passages and verified cases}
      DIAGNOSIS_LOCAL_QDRANT_COLLECTION: ${DIAGNOSIS_LOCAL_QDRANT_COLLECTION:-iot_diagnosis_qwen3_512}
      DIAGNOSIS_RERANKER_PROVIDER: ${DIAGNOSIS_RERANKER_PROVIDER:-weighted}
      DIAGNOSIS_RERANKER_URL: ${DIAGNOSIS_RERANKER_URL:-}
      DIAGNOSIS_RERANKER_MODEL: ${DIAGNOSIS_RERANKER_MODEL:-}
      DIAGNOSIS_RERANKER_API_KEY: ${DIAGNOSIS_RERANKER_API_KEY:-}
      DIAGNOSIS_RERANKER_TIMEOUT_SECONDS: ${DIAGNOSIS_RERANKER_TIMEOUT_SECONDS:-30}
      DIAGNOSIS_LOCAL_RERANKER_FALLBACK: ${DIAGNOSIS_LOCAL_RERANKER_FALLBACK:-false}
      DIAGNOSIS_LOCAL_RERANKER_URL: ${DIAGNOSIS_LOCAL_RERANKER_URL:-http://retrieval-models:9010/rerank}
      DIAGNOSIS_LOCAL_RERANKER_MODEL: ${DIAGNOSIS_LOCAL_RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      DIAGNOSIS_LOCAL_RERANKER_API_KEY: ${DIAGNOSIS_LOCAL_RERANKER_API_KEY:-}
      DIAGNOSIS_LOCAL_RERANKER_TIMEOUT_SECONDS: ${DIAGNOSIS_LOCAL_RERANKER_TIMEOUT_SECONDS:-30}
      DIAGNOSIS_MCP_BEARER_TOKEN: ${DIAGNOSIS_MCP_BEARER_TOKEN:-}
      DIAGNOSIS_READY_MAX_PENDING_SYNC: ${DIAGNOSIS_READY_MAX_PENDING_SYNC:-1000}
      DIAGNOSIS_RETENTION_INTERVAL_HOURS: ${DIAGNOSIS_RETENTION_INTERVAL_HOURS:-24}
      # RAG settings
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-512}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-64}
      RAG_RETRIEVAL_STRATEGY: ${RAG_RETRIEVAL_STRATEGY:-hybrid}
      RAG_ENABLE_SPARSE: ${RAG_ENABLE_SPARSE:-true}
      RAG_ENABLE_RRF: ${RAG_ENABLE_RRF:-true}
      RAG_ENABLE_RERANKER: ${RAG_ENABLE_RERANKER:-true}
      RAG_RERANKER_RANK_WEIGHT: ${RAG_RERANKER_RANK_WEIGHT:-2.0}
      RAG_RERANKER_RANK_FUSION_K: ${RAG_RERANKER_RANK_FUSION_K:-60}
      # Control settings
      CONTROL_DATABASE_PATH: /app/data/iot_control.db
      CONTROL_COMMAND_TIMEOUT_SECONDS: "30"
      CONTROL_VERIFY_WINDOW_SECONDS: "60"
      CONTROL_PROPOSAL_TTL_MINUTES: "30"
      # MQTT settings
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    volumes:
      - iot-mcp-data:/app/data
      - ./packages/mcp-services/common:/app/common:ro
      - ./packages/mcp-services/iot_diagnosis:/app/iot_diagnosis:ro
      - ./packages/mcp-services/iot_control:/app/iot_control:ro
      - ./packages/mcp-services/iot_mcp:/app/iot_mcp:ro
      - ./packages/mcp-services/scripts:/app/scripts:ro
      - ./packages/mcp-services/evals:/app/evals:ro
      - ./packages/mcp-services/knowledge:/app/knowledge:ro
      - ./packages/retrieval/xiaoyi_retrieval:/usr/local/lib/python3.12/site-packages/xiaoyi_retrieval:ro
    depends_on:
      mqtt:
        condition: service_started
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---- ESP32 fleet: real xiaoyi-node firmware running in Espressif QEMU ----
  # Each container is one ESP32 whose flash lives in the esp32-flash volume.
  # Devices reach the broker through their own Toxiproxy proxy so network faults
  # can be injected per device. See packages/esp32-node/README.md.
  esp32-ota:
    build:
      context: ./packages/esp32-node
      dockerfile: qemu/Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org}
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
        IDF_GITHUB_ASSETS: ${IDF_GITHUB_ASSETS:-dl.espressif.com/github_assets}
    image: xiaoyi-esp32-node:local
    command: ["ota-server"]
    ports:
      - "127.0.0.1:8070:8070"
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "127.0.0.1:8474:8474"
    volumes:
      - ./packages/esp32-node/qemu/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

  esp32-01:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_01
      DEVICE_NAME: 车间A-环境监测01
      FIRMWARE_VERSION: "1.3.1"
      REPORT_INTERVAL: "5"
      TEMP_BASE: "27.5"
      BROKER_URI: mqtt://toxiproxy:18301

  esp32-02:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_02
      DEVICE_NAME: 车间A-空压机监测
      FIRMWARE_VERSION: "1.2.0"
      REPORT_INTERVAL: "10"
      TEMP_BASE: "38.0"
      BROKER_URI: mqtt://toxiproxy:18302

  esp32-03:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_03
      DEVICE_NAME: 车间B-焊接工位终端
      FIRMWARE_VERSION: "1.1.4"
      REPORT_INTERVAL: "10"
      TEMP_BASE: "33.5"
      BROKER_URI: mqtt://toxiproxy:18303

  # Slow heap leak in firmware 1.2.0: runs out of memory after about an hour.
  esp32-04:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_04
      DEVICE_NAME: 成品仓库-温湿度终端
      FIRMWARE_VERSION: "1.2.0"
      REPORT_INTERVAL: "15"
      TEMP_BASE: "24.0"
      BOOT_FAULT: memory_leak
      BROKER_URI: mqtt://toxiproxy:18304

  # Uplink drops for 75 s every 10 min: keep alive timeouts on both sides.
  esp32-05:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_05
      DEVICE_NAME: 机房-边缘网关
      FIRMWARE_VERSION: "1.2.0"
      REPORT_INTERVAL: "5"
      TEMP_BASE: "31.0"
      BROKER_URI: mqtt://toxiproxy:18305
      PROXY_NAME: ESP32_05
      NETWORK_FAULT: outage:every=600,duration=75

  esp32-07:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_07
      DEVICE_NAME: 冷库-温度监控
      FIRMWARE_VERSION: "1.1.4"
      REPORT_INTERVAL: "5"
      TEMP_BASE: "4.0"
      BROKER_URI: mqtt://toxiproxy:18307

  # Firmware 1.3.1 on this unit hangs a worker task: task watchdog crash loop.
  esp32-08:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_08
      DEVICE_NAME: 配电房-温度监测
      FIRMWARE_VERSION: "1.3.1"
      REPORT_INTERVAL: "15"
      TEMP_BASE: "41.0"
      BOOT_FAULT: watchdog_reset
      BROKER_URI: mqtt://toxiproxy:18308

  esp32-09:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_09
      DEVICE_NAME: 锅炉房-烟温监测
      FIRMWARE_VERSION: "1.2.0"
      REPORT_INTERVAL: "10"
      TEMP_BASE: "55.0"
      BOOT_FAULT: sensor_error
      BROKER_URI: mqtt://toxiproxy:18309

  # Upstream resets every TCP connection after 4 minutes: reconnect churn.
  esp32-10:
    <<: *esp32-node
    environment:
      DEVICE_ID: ESP32_10
      DEVICE_NAME: 温室大棚-环境监测
      FIRMWARE_VERSION: "1.3.1"
      REPORT_INTERVAL: "10"
      TEMP_BASE: "29.0"
      BROKER_URI: mqtt://toxiproxy:18310
      PROXY_NAME: ESP32_10
      NETWORK_FAULT: reset:every=240,hold=12

  # Template for ad-hoc devices (drills, e2e):
  #   docker compose run -d --rm -e DEVICE_ID=LAB_01 -e BROKER_URI=mqtt://mqtt:1883 esp32-node
  esp32-node:
    <<: *esp32-node
    profiles: ["tools"]
    restart: "no"

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  backend-data:
  iot-mcp-data:
  mqtt-data:
  qdrant-data:
  esp32-flash:
