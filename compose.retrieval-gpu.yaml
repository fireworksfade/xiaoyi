# GPU 检索档位（叠加在 compose.yaml 之上）：
#   docker compose -f compose.yaml -f compose.retrieval-gpu.yaml up -d --build
#
# 资源与冷启动预期：
#   - 显存：两个 Qwen3-0.6B 模型常驻约 2.6 GiB（fp16）；建议预留 4 GiB 以上空闲显存。
#   - 磁盘：模型缓存首次下载约 2.5 GiB（retrieval-model-cache 卷）。
#   - 首次冷启动：下载约 2.5 GiB + 加载，通常 5–20 分钟，取决于带宽与磁盘。
#   - 诊断服务切换到 openai_compatible embedding 与 qwen3 reranker（1024 维集合）。
services:
  retrieval-models:
    build:
      context: ./mcp-services
      dockerfile: Dockerfile.models
    ports:
      - "127.0.0.1:9010:9010"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      MODEL_MAX_LENGTH: "2048"
      EMBEDDING_BATCH_SIZE: "8"
      RERANKER_BATCH_SIZE: "4"
      HF_HOME: /models
      # download：允许从模型源下载缺失文件；下载完成后写入持久卷。
      # 离线部署叠加 compose.retrieval-offline.yaml 切换为 offline。
      MODEL_CACHE_MODE: ${MODEL_CACHE_MODE:-download}
    volumes:
      - retrieval-model-cache:/models
      - ./mcp-services/model_service:/app/model_service:ro
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9010/ready', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 30m
    restart: unless-stopped

  iot-diagnosis-mcp:
    environment:
      DIAGNOSIS_EMBEDDING_PROVIDER: ${DIAGNOSIS_EMBEDDING_PROVIDER:-openai_compatible}
      DIAGNOSIS_EMBEDDING_BASE_URL: ${DIAGNOSIS_EMBEDDING_BASE_URL:-http://retrieval-models:9010/v1}
      DIAGNOSIS_EMBEDDING_MODEL: ${DIAGNOSIS_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      DIAGNOSIS_EMBEDDING_API_KEY: ${DIAGNOSIS_EMBEDDING_API_KEY:-local-model-service}
      DIAGNOSIS_EMBEDDING_DIMENSIONS: ${DIAGNOSIS_EMBEDDING_DIMENSIONS:-1024}
      DIAGNOSIS_VECTOR_BATCH_SIZE: ${DIAGNOSIS_VECTOR_BATCH_SIZE:-32}
      DIAGNOSIS_EMBEDDING_QUERY_INSTRUCTION: ${DIAGNOSIS_EMBEDDING_QUERY_INSTRUCTION:-Given an IoT fault diagnosis query, retrieve relevant technical passages and verified cases}
      DIAGNOSIS_RETRIEVAL_MODEL_HEALTH_URL: ${DIAGNOSIS_RETRIEVAL_MODEL_HEALTH_URL:-http://retrieval-models:9010/ready}
      DIAGNOSIS_RETRIEVAL_MODEL_HEALTH_TIMEOUT_SECONDS: ${DIAGNOSIS_RETRIEVAL_MODEL_HEALTH_TIMEOUT_SECONDS:-3}
      DIAGNOSIS_RERANKER_PROVIDER: ${DIAGNOSIS_RERANKER_PROVIDER:-qwen3}
      DIAGNOSIS_RERANKER_URL: ${DIAGNOSIS_RERANKER_URL:-http://retrieval-models:9010/rerank}
      DIAGNOSIS_RERANKER_TIMEOUT_SECONDS: ${DIAGNOSIS_RERANKER_TIMEOUT_SECONDS:-30}
      DIAGNOSIS_QDRANT_COLLECTION: ${DIAGNOSIS_QDRANT_COLLECTION:-iot_diagnosis_qwen3}
    depends_on:
      mqtt:
        condition: service_started
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      retrieval-models:
        condition: service_healthy

volumes:
  retrieval-model-cache:
